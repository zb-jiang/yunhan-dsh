# The dsh-enterprise-backend bundle patch: server-side unattended backend
# task runner over dsh-base (design 2026-09-14 §7.2). It mounts the webserver
# (REST task endpoints consumed by flowable-engine's DshBackendTaskDelegate),
# the backend-task plugin, the knowledge plugin (kb_* tools over the
# web-console service-key endpoints; kbId arrives in each task payload from
# the delegate), and the instance-workspace plugin (workspace_* tools over the
# service-key endpoints; the instanceId arrives in each task payload and is
# injected into the session prompt); no browser UI and no employee-facing plugins.
# Each instance starts in its own working directory (the task workspace) with
# LLM credentials from the normal settings/env plane; DSH_BACKEND_URL must be
# the address flowable-engine and web-console can reach this instance on.

- insert:
    # stdout 日志 exporter：常驻后端进程的控制台可见 ctx.logger
    # （cordis 内置只写内存缓冲）。levels 必须显式声明：省略时 cordis 只收
    # error+info 并静默丢 warn。
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: !!js Number(process.env.DSH_LOG_LEVEL ?? 3)

    # 常驻 HTTP 服务：backend-task 在其上挂 /api/backend/tasks 前缀路由。
    # 服务器部署需被 flowable-engine/web-console 跨主机访问，默认全接口。
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: !!js process.env.DSH_BACKEND_HOST ?? '0.0.0.0'
        port: !!js Number(process.env.DSH_BACKEND_PORT ?? 3190)

    # 后台任务运行器：REST 端点 + 注册/心跳 daemon + skill 同步 daemon。
    - id: backend-task
      name: '@deepseek-ai/dsh-backend-task'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        selfUrl: !!js process.env.DSH_BACKEND_URL ?? 'http://127.0.0.1:3190'
        backendName: !!js process.env.DSH_BACKEND_NAME ?? 'backend-1'
        skillhubBaseUrl: !!js process.env.SKILLHUB_URL ?? 'http://127.0.0.1:8095'
        skillhubToken: !!js process.env.SKILLHUB_API_TOKEN ?? ''
        syncIntervalMs: !!js Number(process.env.DSH_BACKEND_SYNC_INTERVAL_MS ?? 300000)
        registerIntervalMs: !!js Number(process.env.DSH_BACKEND_REGISTER_INTERVAL_MS ?? 60000)

    # 知识库工具(kb_search/kb_read/kb_list):无登录身份,任务 payload 携带 kbId
    # 时经服务密钥白名单端点(/api/backend/kb/*)访问 web-console。serviceKey 须与
    # web-console dsh.service-key、flowable-engine dsh.web-console.service-key 一致。
    - id: knowledge
      name: '@deepseek-ai/dsh-knowledge'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        serviceKey: !!js process.env.DSH_SERVICE_KEY ?? ''

    # 实例云工作空间工具(workspace_list/read/write/upload/download/delete):无登录
    # 身份,经服务密钥白名单端点(/api/backend/instances/*)访问 web-console;工具
    # 路径重写由插件内 resolveAuth 完成,instanceId 由任务 payload 注入的上下文提供。
    # toolMount global:每个 backend task 会话都是该实例的办理现场,工具常驻根注册表。
    - id: instance-workspace
      name: '@deepseek-ai/dsh-instance-workspace'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        serviceKey: !!js process.env.DSH_SERVICE_KEY ?? ''
        toolMount: 'global'
