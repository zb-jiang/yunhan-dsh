# The dsh-enterprise-app bundle patch: enterprise platform-user authentication
# layer over dsh-web-app. Applied after dsh-web-app's patch; rows here
# insert the platform-user seam, its Web Console provider (read-only: JWKS JWT
# verify + /api/users/me self-read), the HTTP API routes that expose /auth/me and
# /auth/config to the browser surface, and the flowable-engine task API proxy
# (/dsh/tasks, /dsh/history) the employee task workbench fetches through the
# local webserver.

- insert:
    # stdout 日志 exporter：headless webserver 进程的控制台可见 ctx.logger
    # （cordis 内置只写内存缓冲）。levels 必须显式声明：省略时 cordis 只收
    # error+info 并静默丢 warn。
    - id: logger-console
      name: '@deepseek-ai/cordis-plugin-logger-console'
      config:
        levels:
          default: !!js Number(process.env.DSH_LOG_LEVEL ?? 3)

    # 平台用户 Service Definition（提供 ctx.platformUsers，只读）。
    - id: platform-user
      name: '@deepseek-ai/dsh-platform-user'

    # Web-Console-backed provider：JWKS 本地验 JWT 后经 web-console
    # /api/users/me 读治理记录（platform_users 已迁本地 PG，不再直连 Supabase 读表）。
    # SSO provider 三选一（supabase | casdoor | customer-oidc，缺省 supabase）：
    # 非 supabase 时 issuer 必填（无推导），jwksUrl 留空按 OIDC 发现推导。
    - id: platform-user-console
      name: '@deepseek-ai/dsh-platform-user-console'
      config:
        provider: !!js process.env.SSO_PROVIDER ?? 'supabase'
        supabaseUrl: !!js process.env.SUPABASE_URL ?? ''
        issuer: !!js process.env.SSO_ISSUER ?? ''
        jwksUrl: !!js process.env.SSO_JWKS_URL ?? ''
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'

    # HTTP API 路由，注册 /api/enterprise/auth 前缀路由。/auth/config 按
    # provider 分支：supabase 返回 url/anonKey（前端直连），OIDC 返回
    # issuer/clientId/scopes（授权码流程 RP 参数，非 supabase 时 clientId 必填）。
    # oidcRelayUrl 复用 WEB_CONSOLE_URL：relay 基地址即 web-console，空串=
    # 未启用（Pocket Access 手机端登录退回根路径回调）。
    - id: platform-user-api
      name: '@deepseek-ai/dsh-platform-user-api'
      config:
        provider: !!js process.env.SSO_PROVIDER ?? 'supabase'
        supabaseUrl: !!js process.env.SUPABASE_URL ?? ''
        issuer: !!js process.env.SSO_ISSUER ?? ''
        jwksUrl: !!js process.env.SSO_JWKS_URL ?? ''
        supabaseAnonKey: !!js process.env.SUPABASE_ANON_KEY ?? ''
        clientId: !!js process.env.SSO_CLIENT_ID ?? ''
        scopes: !!js process.env.SSO_SCOPES ?? ''
        oidcRelayUrl: !!js process.env.WEB_CONSOLE_URL ?? ''

    # 会话身份上下文：订阅 platform-user 事件维护 ctx.currentUser，
    # 并在每轮第一个 step 向模型注入展示用身份块（含 web-console 组织身份）。
    - id: user-identity-context
      name: '@deepseek-ai/dsh-user-identity-context'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'

    # flowable-engine 任务 API 代理：/dsh/tasks、/dsh/history → engineBaseUrl。
    - id: flowable-task-proxy
      name: '@deepseek-ai/dsh-flowable-task-proxy'
      config:
        engineBaseUrl: !!js process.env.FLOWABLE_ENGINE_URL ?? 'http://127.0.0.1:8090'

    # 企业 skill 分发：daemon 周期调 /dsh/skills/required 预装
    # SkillHub 已发布 skill 到 $DSH_HOME/skill-sync/skills 并注册进 ctx.skills。
    - id: skill-sync
      name: '@deepseek-ai/dsh-skill-sync'
      config:
        flowableBaseUrl: !!js process.env.FLOWABLE_ENGINE_URL ?? 'http://127.0.0.1:8090'
        skillhubBaseUrl: !!js process.env.SKILLHUB_URL ?? 'http://127.0.0.1:8095'
        skillhubToken: !!js process.env.SKILLHUB_API_TOKEN ?? ''
        intervalMs: !!js Number(process.env.SKILL_SYNC_INTERVAL_MS ?? 600000)

    # 企业知识库访问：本地 webserver 代理 /api/enterprise/kb、
    # /api/enterprise/apps → web-console，并注册 kb_search/kb_read/kb_list
    # 工具供待办会话 AI 检索应用知识。
    - id: knowledge
      name: '@deepseek-ai/dsh-knowledge'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        readMaxChars: !!js Number(process.env.KB_READ_MAX_CHARS ?? 40000)

    # 会话知识库归属：员工端上报 任务会话→应用 绑定，每回合 step 1 向模型
    # 注入应用知识库 kbId 块（无需先经 '@' 插入文档即可 kb_search/kb_list）。
    - id: kb-context
      name: '@deepseek-ai/dsh-kb-context'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'

    # 流程实例云工作空间：本地 webserver 代理 /api/enterprise/workspace →
    # web-console，会话绑定上报（任务会话→流程实例）与每回合 <instance_workspace>
    # 注入，注册 workspace_list/read/write/upload/download/delete 工具；
    # 员工端登录态 JWT 模式，serviceKey 保持空串（无人值守场景才需要）。
    # toolMount boundSessions：工具不进全局注册表，仅在会话上报流程实例绑定后
    # 按会话注入——未绑定实例的普通对话模型目录里没有 workspace_*（任务 6 修
    # 水平越权，实例级闸门另由 web-console 参与人校验兜底）。
    - id: instance-workspace
      name: '@deepseek-ai/dsh-instance-workspace'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        readMaxBytes: !!js Number(process.env.INSTANCE_WS_READ_MAX_BYTES ?? 262144)
        uploadMaxBytes: !!js Number(process.env.INSTANCE_WS_UPLOAD_MAX_BYTES ?? 67108864)
        toolMount: 'boundSessions'

    # 员工端 AI 对话发起流程：注册 dsh_process_list / dsh_process_start_form /
    # dsh_process_start 工具，服务端直连 web-console（发起身份 orgUnitId 由
    # 上下文身份块的多位置确认交互产生）。
    - id: process-start
      name: '@deepseek-ai/dsh-process-start'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'

    # 企业模型接入：注册 llm-enterprise provider 路由（pi-ai OpenAI 兼容协议
    # → web-console /api/llm/v1 配额代理），模型目录拉自 /api/llm/models，
    # 随登录事件与定时器刷新；调用凭据为当前登录员工的 Supabase JWT。
    - id: llm-access
      name: '@deepseek-ai/dsh-llm-access'
      config:
        webConsoleBaseUrl: !!js process.env.WEB_CONSOLE_URL ?? 'http://127.0.0.1:8080'
        catalogRefreshMs: !!js Number(process.env.LLM_CATALOG_REFRESH_MS ?? 600000)

    # 已归档会话删除端点：POST /api/enterprise/sessions/delete（仅归档会话，
    # 先删工件目录再清 Workspace 记账，任一后续失败可重试收敛）。
    - id: session-delete
      name: '@deepseek-ai/dsh-session-delete'

    # 手机访问代理：总开关开启时在 0.0.0.0:3081 起动 LAN 代理（双闸门：
    # 配对 cookie + 同账号 Bearer），管理路由 /api/enterprise/pocket/* 仅
    # loopback；bindPort 被占用自动顺延，实际端口进设置页与二维码。
    - id: pocket-access
      name: '@deepseek-ai/dsh-pocket-access'
      config:
        bindPort: !!js Number(process.env.POCKET_BIND_PORT ?? 3081)

    # 目录选择 pin browse：web-app 的 directory-picker 行是 -auto，boot 时按
    # 宿主解析（loopback + win32 → native），而 native 表面走 Electron
    # showOpenDialog——Pocket Access 手机页面调 pick 时对话框弹在 PC 屏幕上
    # （auto 的 Known Limitations 明确记录了这一限制，等按客户端自适应的
    # 部署出现；企业版正是同时服务 PC 与手机的部署）。改为直接组合 browse
    # 表面（应用内自绘目录浏览器，走 list/createDirectory，无 OS chooser），
    # 手机与 PC 同一交互；disable+insert 的写法照 apps/web 的 pin overlay。
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

    - id: ui-enterprise
      name: '@deepseek-ai/dsh-client-ui-enterprise'

# 右侧栏浏览器：web-app 补丁默认仅 desktop profile 启用（disabled 随
# profileContext.name 计算），企业层用同 id 补丁行覆盖为常开。
- id: ui-sidebar-browser
  disabled: false

# 目录选择 -auto：见上方 pin browse 注释——boot 时解析无法按客户端区分，
# 企业层禁用 auto 行，改由 insert 的 browse backend+surface 两行接管。
- id: directory-picker
  disabled: true
