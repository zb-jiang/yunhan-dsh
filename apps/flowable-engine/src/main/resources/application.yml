# DSH Flowable 引擎服务配置
# 环境变量:SUPABASE_URL 指向 Supabase 项目(仅 JWT issuer),
# SUPABASE_DB_HOST/USER/PASSWORD 指向本地 PostgreSQL,
# 参见 docs/plans/2026-08-19-supabase-setup-guide.md 与 docs/plans/2026-09-21-local-pg-setup-guide.md
#
# 所有敏感值通过环境变量注入,不写入仓库。
# 本地开发可在 IDE Run Configuration 配置环境变量,或用 application-dev.yml 覆盖。

server:
  # 避开 Web Console 后端默认 8080;Flowable REST 端点都挂在同一端口下
  port: 8090
  servlet:
    context-path: /

spring:
  application:
    name: dsh-flowable-engine

  # 本地 PostgreSQL 直连(5432);禁止 Supabase transaction pooler 模式(6543),其不支持 prepared statement
  datasource:
    # connectTimeout/socketTimeout(秒,pgjdbc):网络中断时快速失败,防止查询线程卡死在
    # socket 读上耗尽连接池(症状=前端 30s 超时而后台无报错);全部为小查询,60s 足够宽裕
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?connectTimeout=10&socketTimeout=60
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 与 web-console 各分 5,本地 PG 默认 max_connections=100 足够。
      # 恒温 5 条(不用 minimum-idle 缩池):保持常连接避免建连空窗。
      maximum-pool-size: 5
      connection-timeout: 30000
      # 30s 保活探测 + 30 分钟轮换:网络恢复后半死连接及时检出重建,不用等使用时才失败
      keepalive-time: 30000
      max-lifetime: 1800000

# Flowable 7 Spring Boot starter 配置前缀是顶级 flowable.*(不是 spring.flowable.*);
# 写在 spring 下会被忽略,Flowable 回退到默认 schema=public 把 ACT_* 建到 public 下。
flowable:
  # ACT_* 表建在 flowable schema,与 public schema 业务表隔离
  # schema 本身由本地 PG 手册 §3.0 的 CREATE SCHEMA 建好,引擎不自动建 schema
  database-schema: flowable
  # 首次启动自动建 ACT_* 表,后续启动比对版本;表已存在的存量环境可改 false 锁定 schema 演进
  database-schema-update: true
  # 启用异步 executor:定时器边界事件(超时升级 §6.8)、异步 ServiceTask 需要
  async-executor-activate: true
  # 异步 executor 线程池调优(V1):
  # DSH backend task delegate(async ServiceTask)轮询 backend profile 执行 LLM,耗时长,
  # 默认 pool=2/max=10 队列 20000 对单企业单实例偏大;V1 调小便于资源控制。
  # 生产环境按 LLM 平均耗时和实例并发度调整;LLM 调用属于 I/O 密集,可适当大于 CPU 核数。
  async-executor-core-pool-size: 4
  async-executor-max-pool-size: 16
  # 队列容量:待执行的 async Job 等待队列;满了之后新 Job 拒绝并打 ERROR 日志。
  # V1 设 1000 平衡内存占用与突发流量;实际很难触达上限(自动节点 Job 速率低)。
  async-executor-queue-capacity: 1000
  # Job 锁时长(毫秒):避免多实例并发抢同一 Job 时重复执行。
  # 默认 async-job-lock-time=5min,timer-lock-time=1min;LLM 长耗时不影响锁语义(锁防止并发抢,不是超时)。
  async-executor-async-job-lock-time: 300000
  async-executor-timer-lock-time: 300000
  # 暴露 Flowable 官方 REST API(/process-api/*)
  rest-api-enabled: true
  # 关闭 Flowable 自带用户/组表(ACT_ID_*),身份由 Supabase Auth + platform_users 管
  id-generator: false
  # V1 不需要 Event Registry(外部消息触发流程),禁用避免在 public schema 创建 FLW_* 表
  event-registry:
    enabled: false

# DSH 自定义配置
# Spring Security 不在 yaml 中声明 oauth2.resourceserver;
# 由 SecurityConfig 注册 JwtDecoder 用 JwtDecoders.fromIssuerLocation() 从认证中心 OpenID 端点自动拉取 JWKS
dsh:
  supabase:
    # JWT issuer claim:发证方由部署决定(Supabase Auth / Casdoor / 客户 IdP,认证中心设计 D2)
    # DSH_JWT_ISSUER 直接指定;未设置时按 Supabase 约定从 SUPABASE_URL 推导 /auth/v1
    jwt-issuer: ${DSH_JWT_ISSUER:${SUPABASE_URL}/auth/v1}

  # DSH backend task delegate 集成配置(design 2026-09-14 §6.2)
  # DshBackendClient 提交+轮询常驻 backend profile 实例:
  #   POST {dsh:backendTask@backendProfileUrl}/api/backend/tasks → 轮询 GET 任务状态
  # 实例 URL 存在 BPMN 节点上(画布属性面板下拉选择),不在此配置。
  backend:
    # 轮询间隔(秒)
    poll-interval-seconds: 3
    # 单次任务调用总超时(秒,含轮询累计);超时抛异常触发 async Job 重试
    call-timeout-seconds: 600

  # web-console 集成(2026-10 知识库):backend task 提交前按流程定义解析所属
  # 工程知识库。service-key 须与 web-console dsh.service-key、backend profile
  # DSH_SERVICE_KEY 一致;空白时本任务不启用知识库(告警日志)
  web-console:
    base-url: ${WEB_CONSOLE_URL:http://127.0.0.1:8080}
    service-key: ${DSH_SERVICE_KEY:demo-webconsole-service-key}

# Actuator 暴露面收敛:只开 health(部署探活)与 metrics(分析看板运维指标,
# web-console 轮询采集)两个端点;env/configprops/beans 等敏感端点不暴露。
# metrics 端点 permitAll(内网信任,SecurityConfig 有说明,V2 收紧为 service token)
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

logging:
  # 主日志与控制台并行落文件:logs/engine.log(相对引擎工作目录,与 logs/process/ 同级),
  # 终端历史丢失后可从文件回溯;按天+大小滚动,防长期运行无限膨胀
  file:
    name: logs/engine.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/engine.%d{yyyy-MM-dd}.%i.log
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
  level:
    com.dsh.flowable: INFO
    org.flowable: INFO
    org.springframework.security: INFO

sor:
  base-url: ${SOR_BASE_URL:http://127.0.0.1:8091}
  service-key: ${SOR_SERVICE_KEY:demo-service-key}