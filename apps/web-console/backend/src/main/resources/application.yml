# DSH Web Console 后端配置
# 环境变量:SUPABASE_URL/SUPABASE_ANON_KEY 指向 Supabase 项目(Auth),
# SUPABASE_DB_HOST/USER/PASSWORD 指向本地 PostgreSQL,
# SSO_PROVIDER/SSO_ISSUER/SSO_CLIENT_ID/SSO_SCOPES 为认证中心(SSO)配置,
# KB_EMBEDDING_API_KEY/KB_RERANK_API_KEY 为知识库解析与检索管线的 embedding/rerank
# 密钥(默认均为硅基流动控制台创建,可分别指向不同供应商),
# 参见 docs/plans/2026-08-19-supabase-setup-guide.md 与 docs/plans/2026-09-21-local-pg-setup-guide.md
#
# 所有敏感值通过环境变量注入,不写入仓库。
# 本地开发可在 IDE Run Configuration 配置环境变量,或用 application-dev.yml 覆盖。

server:
  port: 8080
  servlet:
    context-path: /
  # 拒收超大上传(multipart 超限准备回 400)时,Tomcat 须先吞完浏览器仍在发送的剩余请求体
  # 才能写出响应;默认只吞 2MB,大文件超限即 RST 连接,浏览器只见 ERR_CONNECTION_RESET
  # 收不到 400。-1 = 不限吞量,保证错误响应可达前端(实例空间/知识库等所有上传端点共用)
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: dsh-web-console

  # 全局 multipart 上限(与知识库上传共用 KB_MAX_UPLOAD_MB)。默认 64MB 对齐
  # dsh.instance-workspace.max-file-mb=64——设计要求业务单文件限额不得超过此硬顶
  servlet:
    multipart:
      max-file-size: ${KB_MAX_UPLOAD_MB:64}MB
      max-request-size: ${KB_MAX_UPLOAD_MB:64}MB

  # 异步请求(SSE 流式转发)总时长上限:Tomcat 默认 30s 会掐断正常的 LLM 长生成
  # (症状=AsyncRequestTimeoutException 被兜底成 500 INTERNAL_ERROR);10 分钟覆盖最慢的推理场景
  mvc:
    async:
      request-timeout: 600000

  # 本地 PostgreSQL 直连;与 Flowable 引擎共享同一 PG 实例的不同 schema
  # Flowable 引擎启动自动建 ACT_* 表(flowable schema),Web Console CRUD 治理元数据表(public schema)
  datasource:
    # connectTimeout/socketTimeout(秒,pgjdbc):网络中断时快速失败,防止查询线程卡死在
    # socket 读上耗尽连接池(症状=前端 30s 超时而后台无报错);全部为小查询,60s 足够宽裕
    url: jdbc:postgresql://${SUPABASE_DB_HOST}:5432/postgres?connectTimeout=10&socketTimeout=60
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 与 flowable-engine 各分 5,本地 PG 默认 max_connections=100 足够。
      # 恒温 5 条(不用 minimum-idle 缩池):保持常连接避免建连空窗。
      maximum-pool-size: 5
      connection-timeout: 30000
      # 30s 保活探测 + 30 分钟轮换:网络恢复后半死连接及时检出重建,不用等使用时才失败
      keepalive-time: 30000
      max-lifetime: 1800000

  # 静态资源:打包前端 dist 后从 classpath:/static/ 提供(Vite 默认 base=/)
  web:
    resources:
      static-locations: classpath:/static/

# DSH 自定义配置
dsh:
  # 认证中心(SSO)配置——部署级唯一 SSO 配置源,员工端 DSH 读同一组 SSO_* 环境变量
  # (设计 docs/plans/2026-10-11-sso-auth-center-design.md §5.2)。RS 验签
  # (SecurityConfig)与 /api/auth/* RP 端点(AuthController)共用以下字段。
  sso:
    # supabase | casdoor | customer-oidc,缺省 supabase
    provider: ${SSO_PROVIDER:supabase}
    # JWT issuer claim:认证中心 issuer;未设置时 supabase 模式按约定从 SUPABASE_URL
    # 推导 /auth/v1,casdoor/customer-oidc 模式启动即失败(绑定期校验)。
    # DSH_JWT_ISSUER 为旧部署兼容变量,仅在不设 SSO_ISSUER 时生效。
    issuer: ${SSO_ISSUER:${DSH_JWT_ISSUER:}}
    # Web Console 前端 RP 在认证中心注册的 client id(与员工端可共用同一 client,
    # redirect_uri 各自登记);casdoor/customer-oidc 模式必填
    client-id: ${SSO_CLIENT_ID:}
    # OIDC 授权码流程 scopes,空按 openid profile(supabase 模式忽略)
    scopes: ${SSO_SCOPES:}
    # Supabase 项目地址与 anon key(supabase 模式经 /api/auth/config 下发前端直连 Auth)
    supabase-url: ${SUPABASE_URL:}
    supabase-anon-key: ${SUPABASE_ANON_KEY:}

  # Flowable 引擎 REST 客户端配置
  # Web Console 后端通过 RestClient 调 Flowable REST 部署 BPMN/发起实例/查任务
  # 认证走"认证直连 Supabase":Web Console 透传当前用户 JWT 给 Flowable,无需 basic auth
  flowable:
    base-url: ${FLOWABLE_BASE_URL}

  # SkillHub REST 客户端配置(企业 Skill 仓库;浏览器不直连,后端持 token 代理)
  skillhub:
    base-url: ${SKILLHUB_BASE_URL:http://127.0.0.1:8095}
    api-token: ${SKILLHUB_API_TOKEN:}

  # 知识库模块:文档原文存服务器本地文件系统(storage-root 根目录,应用间 {appId}/ 分段隔离),
  # 元数据在本地 PG;embedding 走硅基流动 OpenAI 兼容端点(独立 Key,不经 New API)
  knowledge:
    # 文档原文存储根目录(必填,缺失启动即失败);相对路径按进程工作目录解析
    storage-root: ${KB_STORAGE_ROOT:./data/kb-documents}
    # Tesseract 语言训练数据目录(不配则图片 OCR 标记解析失败)
    tessdata-path: ${TESSDATA_PATH:}
    max-upload-size-mb: ${KB_MAX_UPLOAD_MB:50}
    # 解析管线 embedding API(OpenAI 兼容 /embeddings;密钥在硅基流动控制台创建)
    embedding-api-url: ${KB_EMBEDDING_API_URL:https://api.siliconflow.cn/v1}
    embedding-api-key: ${KB_EMBEDDING_API_KEY}
    embedding-model: ${KB_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-4B}
    # 输出维度:请求体 dimensions 钉死宽度;须与 kb_chunks.embedding 列的 halfvec(N) 一致(setup guide §3.3.1 第 5 步)
    embedding-dimensions: ${KB_EMBEDDING_DIMENSIONS:2560}
    embedding-connect-timeout: ${KB_EMBEDDING_CONNECT_TIMEOUT:10s}
    embedding-response-timeout: ${KB_EMBEDDING_RESPONSE_TIMEOUT:120s}
    # chunk 拆分默认参数(上传/重新解析未显式指定时使用)
    chunk-max-size: 1000
    chunk-overlap: 150
    chunk-separator: "\n\n"
    # 向量路召回余弦距离阈值:只挡极端垃圾(kNN 对任意查询必然有输出),边界候选交 rerank 判断
    embedding-max-distance: ${KB_EMBEDDING_MAX_DISTANCE:0.7}
    # 重排:RRF 融合后取 2×topK 候选调 rerank 模型精排,按重排分过滤排序取 topK;失败降级 RRF 排序。
    # rerank API 与 embedding 相互独立(基址/密钥分开配),默认同为硅基流动,可指向其他供应商
    rerank-api-url: ${KB_RERANK_API_URL:https://api.siliconflow.cn/v1}
    rerank-api-key: ${KB_RERANK_API_KEY}
    rerank-model: ${KB_RERANK_MODEL:Qwen/Qwen3-Reranker-8B}
    rerank-min-score: ${KB_RERANK_MIN_SCORE:0.1}

  # 服务密钥（X-Service-Key）：flowable-engine / backend profile 等内网机器调
  # /api/backend/kb/** 只读端点用；空白=机制关闭（所有带此头的请求 401）。
  # 须与 flowable-engine dsh.web-console.service-key、backend profile DSH_SERVICE_KEY 一致
  service-key: ${DSH_SERVICE_KEY:demo-webconsole-service-key}

  # 流程实例云工作空间(设计 docs/plans/2026-10-14-instance-workspace-design.md §3.3):
  # 文件落 web-console 服务器本地磁盘,元数据落 local PG instance_workspace_files 表。
  # 实际单文件上限同时受 spring.servlet.multipart.max-file-size(KB_MAX_UPLOAD_MB,默认 64MB,
  # 与下方 max-file-mb 默认对齐)硬顶;超过硬顶的请求在进入业务逻辑前即被 multipart 拒绝并映射
  # 400 FILE_TOO_LARGE(含上限数值)。
  instance-workspace:
    # 存储根目录({root}/{applicationId}/{instanceId}/{relPath})
    root: ${INSTANCE_WORKSPACE_ROOT:./data/instance-workspaces}
    # 单文件上限(MB)
    max-file-mb: ${INSTANCE_WORKSPACE_MAX_FILE_MB:64}
    # 单实例总容量上限(MB)
    max-instance-total-mb: ${INSTANCE_WORKSPACE_MAX_INSTANCE_TOTAL_MB:512}
    # 单实例文件数上限
    max-entries: ${INSTANCE_WORKSPACE_MAX_ENTRIES:2000}
    # 运行中实例参与人缓存 TTL(秒;参与人=发起人+历任/现任办理人,新办理人接单后
    # 缓存过期重查引擎自愈)。已结束实例参与人稳定,长缓存不受此值限制。
    participant-cache-ttl-seconds: ${INSTANCE_WORKSPACE_PARTICIPANT_CACHE_TTL:60}

  # 分析看板(设计 2026-09-25 §8):轮询引擎 /actuator/metrics 落 dsh_metrics_sample 表。
  # 白名单内指标逐个采集;带 tag 的指标(如 dsh.backend.task{outcome=...})按引擎返回的
  # availableTags 展开逐值采集,落库名形如 "name{tag=value}"。
  analytics:
    # 轮询间隔(毫秒)
    poll-interval-ms: ${ANALYTICS_POLL_INTERVAL_MS:30000}
    # 指标保留天数(每日 03:30 清理过期行)
    retention-days: ${ANALYTICS_RETENTION_DAYS:90}
    # 轮询白名单(引擎 actuator metrics 指标名;白名单外不采集)
    metrics:
      - dsh.flowable.jobs.async
      - dsh.flowable.jobs.timer
      - dsh.flowable.jobs.deadletter
      - dsh.flowable.jobs.suspended
      - dsh.backend.task
      - dsh.task.escalation
      - hikaricp.connections.active
      - jvm.memory.used
    # 简单阈值告警:指标名 → max 阈值;越限写 ANALYTICS_ALERT 审计事件(同一指标 2h 去重)
    alerts:
      "[dsh.flowable.jobs.deadletter]": 0

# New API 网关连接配置(企业统一 LLM 接入,设计 2026-09-27)
# base-url 指向 New API 服务;service-token 为推理转发用的内部服务令牌
# (New API 中额度不限、永不过期)。渠道在 New API 控制台手工创建维护,不经本服务。
newapi:
  base-url: ${NEWAPI_BASE_URL:http://localhost:3000}
  service-token: ${NEWAPI_SERVICE_TOKEN:}
  # TCP 连接建立上限;超时=对端不可达,快速失败
  connect-timeout: 10s
  # 等待上游响应头的上限(TTFB);流式正文的读取时长不受此限,由 spring.mvc.async.request-timeout 兜底
  response-timeout: 120s

logging:
  level:
    com.dsh.console: INFO
    org.springframework.security: INFO
    org.springframework.jdbc.core: INFO
